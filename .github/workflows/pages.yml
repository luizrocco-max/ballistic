name: Publicar no GitHub Pages

# O GitHub Pages deste repositório é servido a partir da branch gh-pages (raiz).
# Este workflow espelha a branch main em gh-pages a cada push, de modo que o
# site publicado corresponde sempre ao conteúdo da main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Espelhar main em gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
